name: CI — Headless BAI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend Tests & Integration Smoke
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEMO_MODE: "true"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: bai-final-year
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-html httpx

      - name: "Debug: Verify main.py version"
        working-directory: bai-final-year
        run: |
          echo "=== Checking main.py contains Patch 1 markers ==="
          grep -n "DEMO_MODE" backend/main.py || echo "❌ DEMO_MODE not found in main.py!"
          grep -n "cache_loaded" backend/main.py || echo "❌ cache_loaded not found in main.py!"
          grep -n "redis_status" backend/main.py || echo "❌ redis_status not found in main.py!"
          echo ""
          echo "=== First 5 lines of main.py ==="
          head -5 backend/main.py
          echo ""
          echo "=== Try importing the module ==="
          python -c "
          import sys, os
          os.environ['DEMO_MODE'] = 'true'
          os.environ['REDIS_HOST'] = 'localhost'
          os.environ['REDIS_PORT'] = '6379'
          try:
              from backend.main import app
              print('✅ backend.main imported successfully')
              print(f'Routes: {[r.path for r in app.routes]}')
          except Exception as e:
              print(f'❌ Import failed: {e}')
              import traceback
              traceback.print_exc()
          "

      - name: Start FastAPI server (DEMO_MODE=true)
        working-directory: bai-final-year
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for server to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Server is ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Server failed to start after 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: "Integration: Verify /health endpoint"
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "Response: $response"
          echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Fields present: {list(data.keys())}')
          assert data.get('status') in ('ok', 'degraded'), f'Unexpected status: {data.get(\"status\")}'
          assert 'redis' in data, f'Missing redis field. Got keys: {list(data.keys())}'
          assert 'demo_mode' in data, f'Missing demo_mode field. Got keys: {list(data.keys())}'
          assert 'timestamp' in data, 'Missing timestamp field'
          print(f'✅ /health — status={data[\"status\"]}, redis={data[\"redis\"]}, demo_mode={data[\"demo_mode\"]}')
          "

      - name: "Integration: Verify /api/layout response schema"
        run: |
          response=$(curl -sf http://localhost:8000/api/layout)
          echo "Response (first 500 chars): $(echo "$response" | head -c 500)"
          echo ""
          echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)

          assert 'layout_order' in data, 'Missing layout_order'
          assert isinstance(data['layout_order'], list), 'layout_order must be a list'
          assert len(data['layout_order']) > 0, 'layout_order is empty'

          assert 'source' in data, 'Missing source field'
          assert data['source'] in ('cache', 'live_ml', 'cache_fallback'), \
              f'Unexpected source: {data[\"source\"]}'

          assert 'section_layout' in data, 'Missing section_layout'
          assert isinstance(data['section_layout'], dict), 'section_layout must be a dict'

          assert 'friction_report' in data, 'Missing friction_report'
          assert 'timestamp' in data, 'Missing timestamp'

          for section_id, geom in data['section_layout'].items():
              for field in ('id', 'x', 'y', 'width', 'height'):
                  assert field in geom, f'Section {section_id} missing {field}'

          known = set(data['section_layout'].keys())
          for section in data['layout_order']:
              assert section in known, f'layout_order contains unknown section: {section}'

          print(f'✅ /api/layout — {len(data[\"layout_order\"])} sections, source={data[\"source\"]}')
          "

      - name: Run pytest unit tests
        working-directory: bai-final-year
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --html=test-report.html \
            --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report
          path: bai-final-year/test-report.html
          retention-days: 30
