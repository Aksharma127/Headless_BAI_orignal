version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    volumes:
      - ./backend:/backend
    working_dir: /backend

volumes:
  redis_data:
